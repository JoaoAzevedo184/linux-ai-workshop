# tarefas.conf - Virtual Host do Apache para o app de tarefas.
#
# Instalar:
#   sudo cp tarefas.conf /etc/apache2/sites-available/tarefas.conf
#   sudo a2ensite tarefas.conf
#   sudo systemctl reload apache2
#
# Para acessar por "http://tarefas.local", adicione ao /etc/hosts:
#   127.0.0.1   tarefas.local

<VirtualHost *:80>
    ServerName tarefas.local
    ServerAdmin webmaster@localhost

    # Pasta onde fica o app (ajuste se copiar para outro lugar)
    DocumentRoot /var/www/tarefas

    <Directory /var/www/tarefas>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs separados para este site (facilita depurar)
    ErrorLog ${APACHE_LOG_DIR}/tarefas_error.log
    CustomLog ${APACHE_LOG_DIR}/tarefas_access.log combined
</VirtualHost>